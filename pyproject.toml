[project]
name = "ldbc-snb-datagen-columnar"
version = "0.1.0"
description = "LDBC SNB datagen (Spark algorithm port) generating columnar data formats"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ladybug>=0.20.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "pandas>=2",
]

[project.scripts]
lbug-datagen = "lbug_datagen.generate:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lbug_datagen*"]
